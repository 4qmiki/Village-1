name: Build Hollowmere Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: Rust/hollowmere-rust

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"
          yes | sdkmanager --licenses

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project
        run: |
          test -f Cargo.toml
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts

      - name: Run Rust tests
        run: cargo test --lib

      - name: Build native Rust library
        run: |
          mkdir -p android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -p 28 \
            -o android/app/src/main/jniLibs \
            build --release --lib

      - name: Verify native library
        run: |
          test -s android/app/src/main/jniLibs/arm64-v8a/libhollowmere.so

      - name: Package game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r assets/. android/app/src/main/assets/

      - name: Build Android APK
        working-directory: Rust/hollowmere-rust/android
        run: gradle assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          echo "APK successfully generated"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hollowmere-Android-ARM64
          path: Rust/hollowmere-rust/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          # This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
